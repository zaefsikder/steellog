<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0b0d" />
<meta name="description" content="STEEL LOG — a personal strength & hypertrophy training ledger." />
<title>STEEL LOG</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="./styles.css" />

<!-- Grain / atmosphere overlay -->
<div class="grain" aria-hidden="true"></div>

<!-- ============================ TOP BAR ============================ -->
<header class="topbar">
  <button id="menuBtn" class="iconbtn" aria-label="Open program menu" aria-controls="drawer" aria-expanded="false">
    <span class="iconbtn__bars"><i></i><i></i><i></i></span>
  </button>

  <button id="sidebarToggle" class="iconbtn iconbtn--rail" type="button" aria-label="Collapse sidebar" aria-expanded="true" aria-controls="drawer" title="Collapse sidebar">
    <span class="rail-ico" aria-hidden="true">«</span>
  </button>

  <div class="brand">
    <span class="brand__mark">◆</span>
    <span class="brand__name">STEEL<span class="brand__thin">LOG</span></span>
  </div>

  <div id="viewToggle" class="viewtoggle" role="tablist" aria-label="Choose view">
    <button class="viewtoggle__btn is-active" type="button" role="tab" data-view="train" aria-selected="true" aria-controls="trainView">Train</button>
    <button class="viewtoggle__btn" type="button" role="tab" data-view="progress" aria-selected="false" aria-controls="progressView">Progress</button>
  </div>
</header>

<!-- Server-waking / connection banner -->
<div id="wakeBanner" class="wake" role="status" hidden>
  <span class="wake__pulse" aria-hidden="true"></span>
  <span class="wake__text">Waking up the server… hang tight.</span>
</div>

<div class="shell">
  <!-- ======================= SIDEBAR / DRAWER ======================= -->
  <div id="scrim" class="scrim" hidden></div>

  <aside id="drawer" class="drawer" aria-label="Program switcher">
    <div class="drawer__head">
      <h2 class="drawer__title">Programs</h2>
      <button id="drawerClose" class="iconbtn iconbtn--x" aria-label="Close menu">✕</button>
    </div>
    <button id="newRoutineBtn" class="drawer__new" type="button">
      <span class="drawer__new-plus" aria-hidden="true">+</span> New routine
    </button>
    <nav id="programList" class="proglist" aria-label="Choose a program">
      <!-- program cards injected here -->
      <div class="proglist__loading skel-stack">
        <div class="skel"></div>
        <div class="skel"></div>
      </div>
    </nav>
    <div class="drawer__foot">
      <div id="userStrip" class="userstrip" hidden>
        <div class="userstrip__who">
          <span class="userstrip__avatar" aria-hidden="true"></span>
          <span id="userEmail" class="userstrip__email"></span>
        </div>
        <button id="signOutBtn" class="userstrip__out" type="button">Sign out</button>
      </div>
      <span class="drawer__tag">Ledger · v1.0</span>
    </div>
  </aside>

  <!-- ============================ MAIN ============================ -->
  <main id="main" class="main" tabindex="-1">
    <!-- ------------------------- TRAIN VIEW ------------------------- -->
    <div id="trainView" role="tabpanel" aria-label="Train">
      <!-- Program header -->
      <section id="programHeader" class="phead" hidden>
        <p class="phead__eyebrow" id="pheadEyebrow">Program</p>
        <h1 class="phead__name" id="pheadName"></h1>
        <p class="phead__sub" id="pheadSub"></p>
        <div class="phead__stats" id="pheadStats"></div>
      </section>

      <!-- Day segmented control -->
      <nav id="dayTabs" class="daytabs" aria-label="Choose a training day" hidden></nav>

      <!-- Day title -->
      <div id="dayTitle" class="daytitle" hidden></div>

      <!-- Exercise list -->
      <section id="exerciseList" class="exlist" aria-live="polite">
        <!-- boot / loading state -->
        <div id="bootState" class="statepanel">
          <div class="statepanel__dot"></div>
          <p class="statepanel__msg">Loading your training ledger…</p>
        </div>
      </section>

      <div class="mainfoot" aria-hidden="true">
        <span class="mainfoot__stripe"></span>
        <span class="mainfoot__word">END OF SESSION</span>
        <span class="mainfoot__stripe"></span>
      </div>
    </div>

    <!-- ------------------------ PROGRESS VIEW ----------------------- -->
    <section id="progressView" class="progress" role="tabpanel" aria-label="Progress" hidden></section>
  </main>
</div>

<!-- Category presets for the builder -->
<datalist id="catPresets">
  <option value="Strength"></option>
  <option value="Hypertrophy"></option>
  <option value="Mobility"></option>
  <option value="Core"></option>
  <option value="Skill/Core"></option>
</datalist>

<!-- Workout builder (create + edit) — populated by app.js -->
<div id="builder" class="builder" role="dialog" aria-modal="true" aria-labelledby="builderTitle" hidden></div>

<!-- Toast region -->
<div id="toaster" class="toaster" aria-live="assertive" aria-atomic="true"></div>

<script src="./config.js"></script>
<script type="module" src="./app.js"></script>
